name: Publicar site de download
on:
  push:
    branches: [main]
    paths: ['download/**', '.github/workflows/site.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Verificar APK
        working-directory: download
        run: |
          test -s radar-0.2.0-test.apk
          unzip -t radar-0.2.0-test.zip
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: download
      - uses: actions/deploy-pages@v4
        id: deployment
