name: Validar e publicar Radar
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s backend/tests -v
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: gradle -p android assembleDebug
      - run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk radar-0.1.0-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose radar-0.1.0-test.apk
          sha256sum radar-0.1.0-test.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: radar-test
          path: |
            radar-0.1.0-test.apk
            SHA256SUMS
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = v0.1.0
          gh release create "$GITHUB_REF_NAME" radar-0.1.0-test.apk SHA256SUMS --prerelease --title 'Radar 0.1.0 — teste' --notes-file docs/RELEASE.md
      - if: startsWith(github.ref, 'refs/tags/')
        run: python scripts/site_metadata.py radar-0.1.0-test.apk
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  pages:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
